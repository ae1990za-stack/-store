function get(k,fallback){try{let x=localStorage.getItem(k);return x?JSON.parse(x):fallback}catch(e){return fallback}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function init(){if(!localStorage.getItem(KEYS.products))set(KEYS.products,defaultProducts);if(!localStorage.getItem(KEYS.categories))set(KEYS.categories,defaultCategories);if(!localStorage.getItem(KEYS.banners))set(KEYS.banners,[{title:'عروض التوفير الكبرى',text:'أسعار مميزة على احتياجات بيتك كل يوم',image:''}]);if(!localStorage.getItem(KEYS.orders))set(KEYS.orders,[]);if(!localStorage.getItem(KEYS.customers))set(KEYS.customers,[]);if(!localStorage.getItem(KEYS.employees))set(KEYS.employees,[]);if(!localStorage.getItem(KEYS.settings))set(KEYS.settings,{name:'هايبر عام',phone:'',whatsapp:'',support:'',address:'',couponPosition:'above',notifications:true});if(!localStorage.getItem(KEYS.coupons))set(KEYS.coupons,[]);}
function downloadJSON(name,data){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function money(n){return Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م'}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imageHtml(src,alt=''){return src?`<img src="${src}" alt="${escapeHtml(alt)}">`:`<div style="font-size:48px;color:#b9c0d0">🛒</div>`}
function productCard(p){return `<article class="product-card" data-product="${p.id}">${(p.discount||p.oldPrice>p.price)?`<span class="badge discount">خصم ${Math.round(p.discount||((p.oldPrice-p.price)/p.oldPrice*100))}%</span>`:p.offer?'<span class="badge discount">عرض</span>':'<span class="badge">جديد</span>'}<div class="product-image">${imageHtml(p.image,p.name)}</div><div class="product-info"><div class="product-category">${escapeHtml(p.category||'منتجات متنوعة')}</div><div class="product-name">${escapeHtml(p.name)}</div><div class="rating"><span>★</span> 0.0 (جديد)</div><div class="product-bottom"><div><div class="price">${money(p.price)}</div>${p.oldPrice>p.price?`<div class="old-price">${money(p.oldPrice)}</div>`:''}</div><button class="add-btn" data-add="${p.id}" aria-label="أضف للسلة">🛒+</button></div></div></article>`}
function renderHome(){let products=get(KEYS.products,[]),cats=get(KEYS.categories,[]),banners=get(KEYS.banners,[]);$('#bannerArea').innerHTML=banners.length?banners.filter(b=>(b.position||'main')==='main').slice(0,5).map((b,i)=>`<div class="banner" style="${b.image?`background-image:url('${b.image}')`:''}"><div class="banner-content"><h2>${escapeHtml(b.title)}</h2><p>${escapeHtml(b.text||'')}</p></div></div>`).join(''):'';
$('#offersGrid').innerHTML=products.filter(p=>p.offer).map(productCard).join('')||'<p>لا توجد عروض حاليًا</p>';let extra=banners.filter(b=>['offers','products','extra'].includes(b.position));let extraHtml=extra.map(b=>`<div class="banner-area"><div class="banner" style="${b.image?`background-image:url('${b.image}');background-size:cover;background-position:center`:''}"><div class="banner-content"><h2>${escapeHtml(b.title)}</h2><p>${escapeHtml(b.text||'')}</p></div></div></div>`).join('');let oldExtra=document.getElementById('extraBanners');if(oldExtra)oldExtra.remove();if(extraHtml){let box=document.createElement('div');box.id='extraBanners';box.innerHTML=extraHtml;let target=document.querySelector('.section:nth-of-type(2)');if(target)target.before(box);else $('#storeView').append(box)}
$('#categoryCircles').innerHTML=cats.slice(0,10).map(c=>`<button class="category-item" data-category="${escapeHtml(c.name)}"><div class="category-image">${c.image?imageHtml(c.image,c.name):c.icon||'🛒'}</div><strong>${escapeHtml(c.name)}</strong></button>`).join('');
$('#productsGrid').innerHTML=products.slice().reverse().map(productCard).join('');$('#allCategories').innerHTML=cats.map(c=>`<button class="category-item" data-category="${escapeHtml(c.name)}"><div class="category-image">${c.image?imageHtml(c.image,c.name):c.icon||'🛒'}</div><strong>${escapeHtml(c.name)}</strong></button>`).join('');
$('#categoryProductsGrid').innerHTML=products.map(productCard).join('');attachCards();updateCartCount();}
function attachCards(){ $$('[data-product]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-add]'))return;showProduct(Number(el.dataset.product))});$$('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();addToCart(Number(b.dataset.add))});$$('[data-category]').forEach(b=>b.onclick=()=>filterCategory(b.dataset.category));}
function showView(name){['storeView','categoriesView','cartView','ordersView','accountView','productView'].forEach(id=>$('#'+id).classList.add('hidden'));let id=({home:'storeView',categories:'categoriesView',cart:'cartView',orders:'ordersView',account:'accountView',product:'productView'})[name]||'storeView';$('#'+id).classList.remove('hidden');$$('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='cart')renderCart();if(name==='orders')renderOrders();if(name==='account')renderAccount();if(name==='categories')renderHome();window.scrollTo(0,0);}
function filterCategory(name){showView('categories');$('#categoryProductsHeading').textContent='منتجات '+name;$('#categoryProductsGrid').innerHTML=get(KEYS.products,[]).filter(p=>p.category===name).map(productCard).join('')||'<p class="panel">لا توجد منتجات في هذا القسم حاليًا.</p>';attachCards();}
function showProduct(id){let p=get(KEYS.products,[]).find(p=>p.id===id);if(!p)return;$('#productDetails').innerHTML=`<div class="panel"><button class="secondary-btn" id="backFromProduct">← رجوع</button><div style="margin-top:16px">${p.image?`<img class="detail-image" src="${p.image}">`:'<div class="detail-image" style="display:grid;place-items:center;font-size:80px">🛒</div>'}</div><p style="color:var(--navy)">${escapeHtml(p.category)}</p><h1>${escapeHtml(p.name)}</h1><div class="rating"><span>★</span> 0.0 (جديد)</div><div class="detail-price">${money(p.price)}</div>${couponPlacement(p)}<p><b>الوصف والخصائص:</b><br>${escapeHtml(p.description||'لا يوجد وصف إضافي لهذا المنتج.')}</p><div class="field"><label>الكمية</label><div class="qty"><button id="detailMinus">−</button><b id="detailQty">1</b><button id="detailPlus">+</button></div></div><button class="primary-btn" id="detailAdd">🛒 إضافة إلى السلة</button>${couponPlacement(p,'below')}</div><section class="section"><h2>تقييمات العملاء</h2><p class="panel">لا توجد تقييمات لهذا المنتج بعد.</p></section>`;
showView('product');$('#backFromProduct').onclick=()=>showView('home');let q=1;$('#detailMinus').onclick=()=>{q=Math.max(1,q-1);$('#detailQty').textContent=q};$('#detailPlus').onclick=()=>{q++;$('#detailQty').textContent=q};$('#detailAdd').onclick=()=>{for(let i=0;i<q;i++)addToCart(id,true);toast('تمت إضافة المنتج إلى السلة');showView('cart')};}
function couponPlacement(p,where='above'){let cfg=get(KEYS.settings,{}),pos=cfg.couponPosition||'above';if((where==='above'&&pos!=='above')||(where==='below'&&pos!=='below'))return '';let list=get(KEYS.coupons,[]).filter(c=>c.active!==false&&(!c.productId||+c.productId===+p.id));if(!list.length)return '';return `<div class="panel" style="margin:12px 0;padding:12px;background:#fff7ed;border:1px dashed var(--orange)"><b>🎟️ كوبونات متاحة</b>${list.map(c=>`<div style="margin-top:6px"><b>${escapeHtml(c.code)}</b> — ${c.type==='amount'?money(c.value):escapeHtml(c.value+'%')} خصم <button class="small-btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('${escapeHtml(c.code)}');document.getElementById('couponInput')&&(document.getElementById('couponInput').value='${escapeHtml(c.code)}');toast('تم نسخ الكوبون')">نسخ الكوبون</button></div>`).join('')}</div>`}
function addToCart(id,silent=false){let cart=get(KEYS.cart,[]),item=cart.find(x=>x.id===id);if(item)item.qty++;else cart.push({id,qty:1});set(KEYS.cart,cart);updateCartCount();if(!silent)toast('تمت إضافة المنتج إلى السلة');}
function updateCartCount(){let n=get(KEYS.cart,[]).reduce((s,x)=>s+x.qty,0);$('#cartCount').textContent=n;$('#cartCount').style.display=n?'block':'none'}
function renderCart(){let cart=get(KEYS.cart,[]),products=get(KEYS.products,[]),lines=cart.map(c=>({...c,p:products.find(p=>p.id===c.id)})).filter(c=>c.p);if(!lines.length){$('#cartContent').innerHTML='<div class="empty-state"><div class="emoji">🛒</div><h2>سلتك فارغة</h2><p>لم تقم بإضافة أي منتجات إلى سلتك بعد.</p><button class="primary-btn" style="max-width:260px" data-view="home">مواصلة التسوق ←</button></div>';return}
let total=lines.reduce((s,c)=>s+c.p.price*c.qty,0);$('#cartContent').innerHTML=`<div class="panel">${lines.map(c=>`<div class="cart-line"><div style="width:65px;height:65px">${c.p.image?`<img src="${c.p.image}">`:'🛒'}</div><div class="grow"><b>${escapeHtml(c.p.name)}</b><div class="price">${money(c.p.price)}</div><div class="qty"><button data-qty="${c.id}" data-delta="-1">−</button>${c.qty}<button data-qty="${c.id}" data-delta="1">+</button><button class="small-btn danger" data-remove="${c.id}">حذف</button></div></div></div>`).join('')}<div class="field"><label>كود الكوبون</label><input id="couponInput" value="${escapeHtml(get(KEYS.cartCoupon,''))}" placeholder="اكتب كود الخصم"><button class="secondary-btn" id="applyCoupon">تطبيق الكوبون</button><small id="couponMsg"></small></div><div class="total-line"><span>الإجمالي قبل الخصم</span><span>${money(total)}</span></div><div class="total-line"><span>الخصم</span><span id="cartDiscount">${money(calcCouponDiscount(total,get(KEYS.cartCoupon,'')))}</span></div><div class="total-line"><span>الإجمالي بعد الخصم</span><span>${money(Math.max(0,total-calcCouponDiscount(total,get(KEYS.cartCoupon,''))))}</span></div><button id="checkoutBtn" class="primary-btn">إتمام الطلب</button></div>`;
$$('[data-qty]').forEach(b=>b.onclick=()=>{let a=get(KEYS.cart,[]),it=a.find(x=>x.id===+b.dataset.qty);if(it)it.qty=Math.max(0,it.qty+(+b.dataset.delta));set(KEYS.cart,a.filter(x=>x.qty>0));renderCart();updateCartCount()});$$('[data-remove]').forEach(b=>b.onclick=()=>{set(KEYS.cart,get(KEYS.cart,[]).filter(x=>x.id!==+b.dataset.remove));renderCart();updateCartCount()});$('#applyCoupon').onclick=()=>{let code=$('#couponInput').value.trim().toUpperCase();if(!findCoupon(code)){toast('الكوبون غير صحيح أو غير فعال');return}set(KEYS.cartCoupon,code);toast('تم تطبيق الكوبون');renderCart()};$('#checkoutBtn').onclick=checkout;}
function findCoupon(code){return get(KEYS.coupons,[]).find(c=>c.code.toUpperCase()===String(code||'').toUpperCase()&&c.active!==false)}function calcCouponDiscount(total,code){let c=findCoupon(code);if(!c)return 0;let v=c.type==='amount'?Number(c.value):total*Number(c.value)/100;return Math.min(total,Math.max(0,v))}
function currentUser(){return get(KEYS.user,null)}
function checkout(){if(!currentUser()){modal(`<h2>تسجيل الدخول أو إنشاء حساب</h2><p>أدخل بياناتك لمتابعة الطلب.</p>${userForm('checkout')}`);return}let user=currentUser(),cart=get(KEYS.cart,[]),products=get(KEYS.products,[]);modal(`<h2>إتمام الطلب</h2><div class="field"><label>الاسم</label><input id="coName" value="${escapeHtml(user.name)}"></div><div class="field"><label>رقم الهاتف</label><input id="coPhone" value="${escapeHtml(user.phone||'')}" required></div><div class="field"><label>العنوان بالتفصيل</label><textarea id="coAddress" required>${escapeHtml(user.address||'')}</textarea></div><div class="field"><label>طريقة الدفع</label><select id="coPay"><option>الدفع عند الاستلام</option><option>تحويل بنكي</option></select></div><button class="primary-btn" id="confirmOrder">تأكيد الطلب</button>`);$('#confirmOrder').onclick=()=>{let name=$('#coName').value.trim(),phone=$('#coPhone').value.trim(),address=$('#coAddress').value.trim();if(!name||!phone||!address){toast('يرجى إكمال البيانات');return}let lines=cart.map(c=>{let p=products.find(p=>p.id===c.id);return p?{id:p.id,name:p.name,price:p.price,qty:c.qty,image:p.image}:null}).filter(Boolean),subtotal=lines.reduce((s,x)=>s+x.price*x.qty,0),couponCode=get(KEYS.cartCoupon,''),discount=calcCouponDiscount(subtotal,couponCode),total=Math.max(0,subtotal-discount),orders=get(KEYS.orders,[]),order={id:Date.now(),customerId:user.id,name,phone,address,email:user.email||'',payment:$('#coPay').value,items:lines,subtotal,discount,couponCode,total,status:'قيد المراجعة',date:new Date().toLocaleString('ar-EG')};orders.unshift(order);set(KEYS.orders,orders);let customers=get(KEYS.customers,[]);if(!customers.some(c=>c.id===user.id))customers.push({...user,phone,address});set(KEYS.customers,customers);set(KEYS.cart,[]);localStorage.removeItem(KEYS.cartCoupon);set(KEYS.user,{...user,name,phone,address});closeModal();updateCartCount();modal(`<h2>تم استلام طلبك بنجاح ✓</h2><p>رقم الطلب: <b>${order.id}</b></p><p>الخصم: <b>${money(discount)}</b></p><p>الإجمالي النهائي: <b>${money(total)}</b></p><p>يمكنك متابعة الطلب من صفحة طلباتي.</p><button class="primary-btn" id="invoiceBtn">عرض الفاتورة</button>`);$('#invoiceBtn').onclick=()=>showInvoice(order.id)}}
function userForm(context='account'){return `<div class="field"><label>الاسم</label><input id="userName" placeholder="الاسم الكامل"></div><div class="field"><label>البريد الإلكتروني</label><input id="userEmail" type="email" placeholder="name@example.com"></div><div class="field"><label>رقم الهاتف</label><input id="userPhone" placeholder="01xxxxxxxxx"></div><div class="field"><label>كلمة المرور</label><input id="userPass" type="password" placeholder="كلمة المرور"></div><button class="primary-btn" id="userSave">دخول / إنشاء حساب</button><p style="font-size:12px;color:var(--muted)">نسخة تجريبية: الحساب محفوظ على هذا الجهاز فقط.</p>`}
function bindUserForm(context){$('#userSave').onclick=()=>{let name=$('#userName').value.trim(),email=$('#userEmail').value.trim(),phone=$('#userPhone').value.trim(),pass=$('#userPass').value;if(!name||!email||!pass){toast('أدخل الاسم والبريد وكلمة المرور');return}let users=get(KEYS.customers,[]),existing=users.find(u=>u.email===email);if(existing&&existing.password!==pass){toast('كلمة المرور غير صحيحة');return}let user=existing||{id:Date.now(),name,email,phone,password:pass};set(KEYS.user,user);if(!existing){users.push(user);set(KEYS.customers,users)}closeModal();if(context==='checkout')checkout();else renderAccount();toast('تم تسجيل الدخول')}}
function renderAccount(){let u=currentUser();if(!u){$('#accountContent').innerHTML=`<div class="panel"><h2>مرحبًا بك في هايبر عام</h2><p>سجل الدخول لمتابعة طلباتك وحفظ بياناتك.</p><button class="primary-btn" id="loginBtn">تسجيل الدخول / إنشاء حساب</button></div>`;$('#loginBtn').onclick=()=>modal(`<h2>حساب العميل</h2>${userForm()}`)&&bindUserForm('account');return}
$('#accountContent').innerHTML=`<div class="profile-card"><div class="profile-avatar">●</div><h2>${escapeHtml(u.name)}</h2><p>${escapeHtml(u.email)}</p></div><div class="menu-list"><button data-account="edit">⚙️ تعديل الملف الشخصي <span>‹</span></button><button data-account="password">🔐 تغيير كلمة المرور <span>‹</span></button><button data-view="orders">▤ طلباتي السابقة <span>‹</span></button><button data-account="support">🎧 تواصل معنا والدعم <span>‹</span></button><button data-account="about">ⓘ عن هايبر عام <span>‹</span></button></div><div class="panel"><h2>مظهر التطبيق</h2><p>اختر بين الوضع الفاتح والداكن</p><div style="display:flex;gap:8px"><button class="secondary-btn" data-theme="light">☼ فاتح</button><button class="secondary-btn" data-theme="dark">☾ داكن</button><button class="secondary-btn" data-theme="auto">تلقائي</button></div></div><div class="panel"><button id="logoutBtn" class="secondary-btn" style="width:100%;color:#d33;border-color:#d33">تسجيل الخروج ↪</button></div>`;
$$('[data-account]').forEach(b=>b.onclick=()=>accountAction(b.dataset.account));$$('[data-theme]').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));$('#logoutBtn').onclick=()=>{localStorage.removeItem(KEYS.user);renderAccount();toast('تم تسجيل الخروج')}}
function accountAction(a){let u=currentUser();if(a==='edit'){modal(`<h2>تعديل الملف الشخصي</h2><div class="field"><label>الاسم</label><input id="editName" value="${escapeHtml(u.name)}"></div><div class="field"><label>البريد</label><input id="editEmail" value="${escapeHtml(u.email)}"></div><div class="field"><label>الهاتف</label><input id="editPhone" value="${escapeHtml(u.phone||'')}"></div><button class="primary-btn" id="saveProfile">حفظ التعديلات</button>`);$('#saveProfile').onclick=()=>{let n={...u,name:$('#editName').value,email:$('#editEmail').value,phone:$('#editPhone').value};set(KEYS.user,n);let cs=get(KEYS.customers,[]).map(x=>x.id===u.id?n:x);set(KEYS.customers,cs);closeModal();renderAccount()}}else if(a==='password'){modal(`<h2>تغيير كلمة المرور</h2><div class="field"><label>كلمة المرور الحالية</label><input id="oldPass" type="password"></div><div class="field"><label>كلمة المرور الجديدة</label><input id="newPass" type="password"></div><button class="primary-btn" id="savePass">تغيير كلمة المرور</button>`);$('#savePass').onclick=()=>{if($('#oldPass').value!==u.password||!$('#newPass').value){toast('تحقق من كلمة المرور');return}let n={...u,password:$('#newPass').value};set(KEYS.user,n);set(KEYS.customers,get(KEYS.customers,[]).map(x=>x.id===u.id?n:x));closeModal();toast('تم تغيير كلمة المرور')}}else modal(`<h2>${a==='support'?'تواصل معنا والدعم':'عن هايبر عام'}</h2><p>${a==='support'?`رقم الدعم: ${escapeHtml(get(KEYS.settings,{}).support||get(KEYS.settings,{}).whatsapp||get(KEYS.settings,{}).phone||'لم يتم إضافته بعد')}`:'هايبر عام — تسوق احتياجاتك اليومية بسهولة وبأسعار مناسبة.'}</p>`)}
function renderOrders(){let u=currentUser();if(!u){$('#ordersContent').innerHTML='<div class="empty-state"><div class="emoji">⚠️</div><h2>يرجى تسجيل الدخول أولًا</h2><button class="primary-btn" id="ordersLogin" style="max-width:250px">تسجيل الدخول</button></div>';$('#ordersLogin').onclick=()=>{showView('account')};return}let orders=get(KEYS.orders,[]).filter(o=>o.customerId===u.id);$('#ordersContent').innerHTML=orders.length?orders.map(o=>`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px"><b>طلب رقم #${o.id}</b><span class="badge">${escapeHtml(o.status)}</span></div><p>${escapeHtml(o.date)}</p><p>${o.items.map(i=>`${escapeHtml(i.name)} × ${i.qty}`).join('<br>')}</p><div class="total-line"><span>الإجمالي</span><span>${money(o.total)}</span></div><button class="secondary-btn" data-invoice="${o.id}">عرض الفاتورة</button></div>`).join(''):'<div class="empty-state"><div class="emoji">🧾</div><h2>لا توجد طلبات بعد</h2><p>ستظهر طلباتك هنا بعد إتمام الشراء.</p></div>';$$('[data-invoice]').forEach(b=>b.onclick=()=>showInvoice(+b.dataset.invoice))}
function showInvoice(id){let o=get(KEYS.orders,[]).find(x=>x.id===id);if(!o)return;modal(`<div id="invoicePrint" style="background:#fff;color:#17265f;padding:22px;border:2px solid #e5e7eb;border-radius:14px"><h2 style="text-align:center">${escapeHtml(get(KEYS.settings,{}).name||'هايبر عام')} — فاتورة</h2><p>رقم الفاتورة: <b>${o.id}</b></p><p>التاريخ: ${escapeHtml(o.date)}</p><hr><p>العميل: ${escapeHtml(o.name)}</p><p>الهاتف: ${escapeHtml(o.phone)}</p><p>البريد: ${escapeHtml(o.email||'—')}</p><p>العنوان: ${escapeHtml(o.address)}</p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:right">المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${o.items.map(i=>`<tr><td style="padding:7px;border-bottom:1px solid #ddd">${escapeHtml(i.name)}</td><td style="text-align:center">${i.qty}</td><td>${money(i.price)}</td><td>${money(i.price*i.qty)}</td></tr>`).join('')}</tbody></table><hr><p>الإجمالي قبل الخصم: <b>${money(o.subtotal??o.items.reduce((s,i)=>s+i.price*i.qty,0))}</b></p>${o.couponCode?`<p>الكوبون: ${escapeHtml(o.couponCode)}</p>`:''}<p>الخصم: <b>${money(o.discount||0)}</b></p><div class="total-line"><span>الإجمالي النهائي</span><span>${money(o.total)}</span></div><p>طريقة الدفع: ${escapeHtml(o.payment)}</p><p>حالة الطلب: ${escapeHtml(o.status)}</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="primary-btn" id="printInvoice">حفظ PDF / طباعة</button><button class="secondary-btn" id="imageInvoice">تحميل الفاتورة صورة</button></div>`);$('#printInvoice').onclick=()=>{const old=document.title;document.title='Invoice-'+o.id;window.print();document.title=old};$('#imageInvoice').onclick=async()=>{if(!window.html2canvas){toast('تعذر تحميل أداة الصورة؛ استخدم حفظ PDF');return}try{let canvas=await html2canvas($('#invoicePrint'),{scale:2,backgroundColor:'#ffffff'});let a=document.createElement('a');a.download='فاتورة-'+o.id+'.png';a.href=canvas.toDataURL('image/png');a.click()}catch(e){toast('تعذر حفظ الصورة')}}}

function modal(html){$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden');if($('#userSave'))bindUserForm('account')}
function closeModal(){$('#modal').classList.add('hidden')}
function toast(msg){let t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2400)}

async function notifyNewProduct(p){let cfg=get(KEYS.settings,{});if(cfg.notifications===false)return;let seen=get('ha_seen_product_ids',[]);if(seen.includes(p.id))return;seen.push(p.id);set('ha_seen_product_ids',seen);if('Notification' in window){try{if(Notification.permission==='default')await Notification.requestPermission();if(Notification.permission==='granted')new Notification('منتج جديد في هايبر عام',{body:p.name+' — '+money(p.price)});}catch(e){}}}

function openAdmin(){let tab='dashboard';function draw(){let products=get(KEYS.products,[]),orders=get(KEYS.orders,[]),customers=get(KEYS.customers,[]),cats=get(KEYS.categories,[]),banners=get(KEYS.banners,[]),employees=get(KEYS.employees,[]),coupons=get(KEYS.coupons,[]),subscriptions=get(KEYS.subscriptions,[]),settings=get(KEYS.settings,{});modal(`<div class="admin-head"><h2>لوحة تحكم هايبر عام</h2><p>إدارة المتجر والمنتجات والطلبات والفواتير والعملاء</p></div><div class="admin-tabs">${[['dashboard','الرئيسية'],['products','المنتجات'],['orders','الطلبات'],['invoices','الفواتير'],['customers','العملاء'],['categories','الأقسام'],['banners','البنرات'],['coupons','العروض والكوبونات'],['subscriptions','الاشتراكات'],['employees','الموظفون'],['settings','إعدادات المتجر'],['security','كلمات المرور']].map(x=>`<button class="${tab===x[0]?'active':''}" data-admin-tab="${x[0]}">${x[1]}</button>`).join('')}</div><div id="adminPanel">${adminContent(tab,{products,orders,customers,cats,banners,employees,coupons,subscriptions,settings})}</div>`);$$('[data-admin-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.adminTab;draw()});bindAdmin(tab,draw)}
draw()}

if(tab==='products')return `<button class="primary-btn" id="addProduct">＋ إضافة منتج</button><div>${d.products.map(p=>`<div class="admin-item">${p.image?`<img src="${p.image}">`:'<span>🛒</span>'}<div class="grow"><b>${escapeHtml(p.name)}</b><div>${money(p.price)} · ${escapeHtml(p.category)}</div></div><button class="small-btn" data-edit-product="${p.id}">تعديل</button><button class="small-btn danger" data-del-product="${p.id}">حذف</button></div>`).join('')}</div>`;

if(tab==='banners')return `<button class="primary-btn" id="addBanner">＋ إضافة بنر</button>${d.banners.map((b,i)=>`<div class="admin-item">${b.image?`<img src="${b.image}">`:'🖼️'}<div class="grow"><b>${escapeHtml(b.title)}</b><div>${escapeHtml(b.text||'')}</div><small>المكان: ${escapeHtml(b.position||'main')}</small></div><button class="small-btn" data-edit-banner="${i}">تعديل</button><button class="small-btn danger" data-del-banner="${i}">حذف</button></div>`).join('')}`;
if(tab==='coupons')return `<button class="primary-btn" id="addCoupon">＋ إضافة كوبون</button>${d.coupons.map((c,i)=>`<div class="admin-item"><div class="grow"><b>${escapeHtml(c.code)}</b><div>${c.type==='amount'?money(c.value):escapeHtml(c.value+'%')} · ${c.active===false?'غير فعال':'فعال'} · ${c.productId?'منتج محدد':'كل المنتجات'}</div></div><button class="small-btn" data-edit-coupon="${i}">تعديل</button><button class="small-btn danger" data-del-coupon="${i}">حذف</button></div>`).join('')}`;

if(tab==='settings')return `<div class="field"><label>اسم المتجر</label><input id="setName" value="${escapeHtml(d.settings.name||'')}"></div><div class="field"><label>رقم الهاتف</label><input id="setPhone" value="${escapeHtml(d.settings.phone||'')}"></div><div class="field"><label>واتساب</label><input id="setWhatsapp" value="${escapeHtml(d.settings.whatsapp||'')}"></div><div class="field"><label>رقم التواصل مع الدعم</label><input id="setSupport" value="${escapeHtml(d.settings.support||'')}" placeholder="رقم الهاتف أو واتساب الدعم"></div><div class="field"><label>مكان ظهور الكوبون في تفاصيل المنتج</label><select id="setCouponPosition"><option value="above" ${(d.settings.couponPosition||'above')==='above'?'selected':''}>فوق زر إضافة إلى السلة</option><option value="below" ${d.settings.couponPosition==='below'?'selected':''}>تحت زر إضافة إلى السلة</option></select></div><div class="field"><label><input id="setNotifications" type="checkbox" ${d.settings.notifications!==false?'checked':''} style="width:auto"> تفعيل إشعارات المنتجات الجديدة</label></div><div class="field"><label>العنوان</label><textarea id="setAddress">${escapeHtml(d.settings.address||'')}</textarea></div><button class="primary-btn" id="saveSettings">حفظ الإعدادات</button><p class="panel">تنبيه: التخزين المحلي يبقى بعد إغلاق المتصفح، لكنه قد يُحذف عند مسح بيانات الموقع أو إعادة ضبط المتصفح. نزّل نسخة احتياطية بانتظام من قسم العملاء.</p>`;
if(tab==='security')return `<p>تغيير كلمات مرور بوابة الإدارة (محليًا في هذا المتصفح فقط).</p><div class="field"><label>رمز مكان الخطر الجديد</label><input id="newDanger" type="password" placeholder="اتركه فارغًا للإبقاء على الحالي"></div><div class="field"><label>كلمة مرور لوحة التحكم الجديدة</label><input id="newAdmin" type="password" placeholder="اتركها فارغة للإبقاء على الحالية"></div><button class="primary-btn" id="saveSecurity">حفظ كلمات المرور</button>`;
return ''}
function imageField(id,label,current=''){return `<div class="field"><label>${label}</label><input id="${id}" type="file" accept="image/*"><div style="font-size:12px;color:var(--muted)">اختر صورة مباشرة من الجهاز${current?' — توجد صورة حالية':''}</div><div id="${id}Preview">${current?`<img src="${current}" style="max-width:120px;max-height:90px;object-fit:contain">`:''}</div></div>`}
function readImage(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}if(file.size>2.5*1024*1024){reject(new Error('حجم الصورة كبير؛ اختر صورة أقل من 2.5 ميجابايت'));return}let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function productForm(p={}){modal(`<h2>${p.id?'تعديل المنتج':'إضافة منتج'}</h2><div class="field"><label>اسم المنتج</label><input id="pName" value="${escapeHtml(p.name||'')}"></div><div class="field"><label>القسم</label><select id="pCategory">${get(KEYS.categories,[]).map(c=>`<option ${c.name===p.category?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div><div class="field"><label>السعر بالجنيه</label><input id="pPrice" type="number" min="0" step=".01" value="${p.price||''}"></div><div class="field"><label>السعر قبل الخصم (اختياري)</label><input id="pOld" type="number" min="0" step=".01" value="${p.oldPrice||''}"></div><div class="field"><label>نسبة الخصم % (اختياري)</label><input id="pDiscount" type="number" min="0" max="100" step="1" value="${p.discount||''}" placeholder="مثال: 15"><small>عند إدخال النسبة يُحسب السعر قبل الخصم تلقائيًا إذا لم تكتبه.</small></div><div class="field"><label>الوصف</label><textarea id="pDesc">${escapeHtml(p.description||'')}</textarea></div>${imageField('pImage','صورة المنتج من الجهاز',p.image||'')}<div class="field"><label><input id="pOffer" type="checkbox" ${p.offer?'checked':''} style="width:auto"> عرض مميز</label></div><button class="primary-btn" id="saveProduct">حفظ المنتج</button>`);$('#saveProduct').onclick=async()=>{try{let image=await readImage($('#pImage').files[0]);let all=get(KEYS.products,[]),price=+$('#pPrice').value,discount=Math.max(0,Math.min(100,+$('#pDiscount').value||0)),oldInput=+$('#pOld').value||0,oldPrice=oldInput||(discount&&price?Math.round(price/(1-discount/100)*100)/100:0),obj={id:p.id||Date.now(),name:$('#pName').value.trim(),category:$('#pCategory').value,price,oldPrice,discount,description:$('#pDesc').value,image:image||p.image||'',offer:$('#pOffer').checked||discount>0};if(!obj.name||!obj.price){toast('أدخل اسم المنتج والسعر');return}set(KEYS.products,p.id?all.map(x=>x.id===p.id?obj:x):[obj,...all]);if(!p.id)notifyNewProduct(obj);closeModal();renderHome();openAdmin();toast('تم حفظ المنتج')}catch(e){toast(e.message)}}}
function couponForm(c={},idx=-1){modal(`<h2>${idx>=0?'تعديل كوبون':'إضافة كوبون خصم'}</h2><div class="field"><label>كود الكوبون</label><input id="couponCode" value="${escapeHtml(c.code||'')}" placeholder="SAVE10"></div><div class="field"><label>نوع الخصم</label><select id="couponType"><option value="percent" ${c.type!=='amount'?'selected':''}>نسبة مئوية %</option><option value="amount" ${c.type==='amount'?'selected':''}>مبلغ بالجنيه</option></select></div><div class="field"><label>قيمة الخصم</label><input id="couponValue" type="number" min="0" step=".01" value="${c.value||''}"></div><div class="field"><label>تطبيق على منتج محدد (اختياري)</label><select id="couponProduct"><option value="">كل المنتجات</option>${get(KEYS.products,[]).map(p=>`<option value="${p.id}" ${String(c.productId||'')===String(p.id)?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select></div><div class="field"><label><input id="couponActive" type="checkbox" ${c.active!==false?'checked':''} style="width:auto"> الكوبون فعال</label></div><button class="primary-btn" id="saveCoupon">حفظ الكوبون</button>`);$('#saveCoupon').onclick=()=>{let code=$('#couponCode').value.trim().toUpperCase(),value=Number($('#couponValue').value),type=$('#couponType').value;if(!code||!value||value<0||(type==='percent'&&value>100)){toast('راجع كود الكوبون وقيمته');return}let all=get(KEYS.coupons,[]);if(all.some((x,i)=>x.code===code&&i!==idx)){toast('هذا الكود موجود بالفعل');return}let obj={code,value,type,productId:$('#couponProduct').value||'',active:$('#couponActive').checked};if(idx>=0)all[idx]=obj;else all.push(obj);set(KEYS.coupons,all);closeModal();openAdmin();toast('تم حفظ الكوبون')}}

if($('#saveSecurity'))$('#saveSecurity').onclick=()=>{if($('#newDanger').value)localStorage.setItem('ha_danger_pass',$('#newDanger').value);if($('#newAdmin').value)localStorage.setItem('ha_admin_pass',$('#newAdmin').value);toast('تم حفظ كلمات المرور لهذه النسخة التجريبية');draw()}}
function subscriptionForm(){modal(`<h2>إضافة اشتراك</h2><div class="field"><label>اسم العميل</label><input id="subName"></div><div class="field"><label>رقم الهاتف</label><input id="subPhone"></div><div class="field"><label>نوع الاشتراك/الباقة</label><input id="subPlan" placeholder="مثال: توصيل شهري"></div><div class="field"><label>تاريخ الانتهاء (اختياري)</label><input id="subUntil" type="date"></div><div class="field"><label>الحالة</label><select id="subStatus"><option>فعال</option><option>متوقف</option></select></div><button class="primary-btn" id="saveSub">حفظ الاشتراك</button>`);$('#saveSub').onclick=()=>{let name=$('#subName').value.trim();if(!name)return toast('اكتب اسم العميل');let a=get(KEYS.subscriptions,[]);a.unshift({id:Date.now(),name,phone:$('#subPhone').value,plan:$('#subPlan').value,until:$('#subUntil').value,status:$('#subStatus').value});set(KEYS.subscriptions,a);closeModal();openAdmin();toast('تم حفظ الاشتراك محليًا')}}
function categoryForm(c={},idx=-1){modal(`<h2>${idx>=0?'تعديل قسم':'إضافة قسم دائري'}</h2><div class="field"><label>اسم القسم</label><input id="cName" value="${escapeHtml(c.name||'')}"></div><div class="field"><label>رمز تعبيري (اختياري)</label><input id="cIcon" value="${escapeHtml(c.icon||'🛒')}"></div>${imageField('cImage','صورة القسم من الجهاز',c.image||'')}<button class="primary-btn" id="saveCat">حفظ القسم</button>`);$('#saveCat').onclick=async()=>{try{let image=await readImage($('#cImage').files[0]),a=get(KEYS.categories,[]),obj={name:$('#cName').value.trim(),icon:$('#cIcon').value,image:image||c.image||''};if(!obj.name)return toast('اكتب اسم القسم');if(idx>=0)a[idx]=obj;else a.push(obj);set(KEYS.categories,a);closeModal();renderHome();openAdmin()}catch(e){toast(e.message)}}}
function bannerForm(b={},idx=-1){modal(`<h2>${idx>=0?'تعديل بنر':'إضافة بنر جديد'}</h2><div class="field"><label>العنوان الظاهر على البنر</label><input id="bTitle" value="${escapeHtml(b.title||'')}"></div><div class="field"><label>النص الإضافي</label><input id="bText" value="${escapeHtml(b.text||'')}"></div><div class="field"><label>مكان ظهور البنر</label><select id="bPosition"><option value="main" ${(b.position||'main')==='main'?'selected':''}>البنرات الرئيسية</option><option value="offers" ${b.position==='offers'?'selected':''}>فوق قسم العروض</option><option value="products" ${b.position==='products'?'selected':''}>فوق المنتجات</option><option value="extra" ${b.position==='extra'?'selected':''}>مكان إضافي جديد</option></select></div>${imageField('bImage','صورة البنر من الجهاز',b.image||'')}<button class="primary-btn" id="saveBanner">حفظ البنر</button>`);$('#saveBanner').onclick=async()=>{try{let image=await readImage($('#bImage').files[0]),a=get(KEYS.banners,[]),obj={title:$('#bTitle').value.trim(),text:$('#bText').value,image:image||b.image||'',position:$('#bPosition').value};if(!obj.title)return toast('اكتب عنوان البنر');if(idx>=0)a[idx]=obj;else a.push(obj);set(KEYS.banners,a);closeModal();renderHome();openAdmin()}catch(e){toast(e.message)}}}
function employeeForm(){modal(`<h2>إضافة موظف</h2><div class="field"><label>اسم الموظف</label><input id="eName"></div><div class="field"><label>الوظيفة</label><input id="eRole" placeholder="إدارة الطلبات، تجهيز، توصيل..."></div><div class="field"><label>رقم الهاتف</label><input id="ePhone"></div><button class="primary-btn" id="saveEmployee">حفظ الموظف</button>`);$('#saveEmployee').onclick=()=>{if(!$('#eName').value.trim())return toast('اكتب اسم الموظف');let a=get(KEYS.employees,[]);a.push({name:$('#eName').value,role:$('#eRole').value,phone:$('#ePhone').value});set(KEYS.employees,a);closeModal();openAdmin()}}
function searchProducts(){let q=$('#searchInput').value.trim().toLowerCase(),p=get(KEYS.products,[]).filter(x=>(x.name+' '+x.category+' '+x.description).toLowerCase().includes(q));$('#productsHeading').textContent=q?'نتائج البحث':'أحدث المنتجات';$('#productsGrid').innerHTML=p.map(productCard).join('')||'<p class="panel">لا توجد نتائج مطابقة.</p>';attachCards();showView('home');$('#productsGrid').scrollIntoView({behavior:'smooth'})}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v)showView(v.dataset.view);let f=e.target.closest('[data-filter]');if(f){$('#productsHeading').textContent='العروض';$('#productsGrid').innerHTML=get(KEYS.products,[]).filter(p=>p.offer).map(productCard).join('');attachCards();$('#productsGrid').scrollIntoView({behavior:'smooth'})}});
$('#bellBtn').onclick=async()=>{if(!('Notification' in window)){toast('الإشعارات غير مدعومة في هذا المتصفح');return}if(Notification.permission==='granted'){toast('إشعارات المتصفح مفعلة؛ يتم التنبيه عند إضافة منتج من لوحة التحكم على هذا الجهاز');return}let r=await Notification.requestPermission();toast(r==='granted'?'تم تفعيل الإشعارات على هذا الجهاز':'لم يتم السماح بالإشعارات')};$('#searchBtn').onclick=searchProducts;$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchProducts()});$('#searchToggle').onclick=()=>{$('.search-wrap').scrollIntoView({behavior:'smooth'});$('#searchInput').focus()};$('#themeQuick').onclick=()=>setTheme(document.body.classList.contains('dark')?'light':'dark');$('#dangerLink').onclick=e=>{e.preventDefault();dangerEntry()};$('#supportLink').onclick=e=>{e.preventDefault();let c=get(KEYS.settings,{}),n=(c.support||c.whatsapp||c.phone||'').replace(/[^0-9+]/g,'');if(!n){modal('<h2>تواصل مع الدعم</h2><p>لم يضف صاحب المتجر رقم الدعم بعد. يمكنك ضبطه من لوحة التحكم ← إعدادات المتجر.</p>');return}modal(`<h2>تواصل مع الدعم</h2><p>رقم الدعم: ${escapeHtml(c.support||c.whatsapp||c.phone)}</p><a class="primary-btn" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/${n.replace(/^\+/,'')}" target="_blank" rel="noopener">فتح واتساب الدعم</a>`)};$('#modalClose').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
init();let th=get(KEYS.theme,'light');if(th==='dark')document.body.classList.add('dark');renderHome();if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
</body></html>
